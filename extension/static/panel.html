<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ask openside</title>
<link rel="stylesheet" href="fonts/wanted-sans/WantedSansVariable.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="team.css">
</head>
<body class="panel">
<header class="bar">
<h1 class="sr-only">Ask openside</h1>
<div class="session-picker" id="sessions"></div>
<p id="connection" class="connection"></p>
<button id="pair" type="button" class="icon-button" aria-label="Pairing and settings" title="Pairing and settings"><span data-icon="settings"></span></button>
</header>
<main class="scroll thin-scroll">
<div class="column">
<section id="transcript" class="timeline" aria-live="polite"></section>
<section id="tickets" class="tickets"></section>
<div class="empty empty-paired"><span class="empty-icon" data-icon="message-square" data-size="22"></span><h2>Ask about this tab</h2><p>Type <kbd>@</kbd> in your message to attach the page you are looking at, or pick an earlier session above.</p></div>
<div class="empty empty-unpaired"><span class="empty-icon" data-icon="key-round" data-size="22"></span><h2>Pair openside first</h2><p>Connect this browser to your openside daemon with a pairing link from Connect a phone.</p><button id="pair-start" type="button" class="button compact primary">Pair openside</button></div>
</div>
</main>
<div class="dock">
<div class="toast glass-float" data-tone="info"><span class="toast-icon" data-icon="circle-alert" data-size="18"></span><p id="status" role="status"></p><button type="button" class="toast-close" aria-label="Dismiss"><span data-icon="x" data-size="16"></span></button></div>
<form id="compose" class="composer">
<p id="context" class="context-chip"></p>
<div class="composer-row">
<label class="composer-field"><span class="sr-only">Message</span><textarea id="message" rows="1" required placeholder="Ask about this tab"></textarea></label>
<button id="attach" type="button" class="icon-button" aria-label="@ This tab" title="Attach this tab (@)"><span data-icon="at-sign"></span></button>
<button type="submit" class="icon-button primary" aria-label="Send" title="Send"><span data-icon="arrow-up"></span></button>
</div>
</form>
</div>
<script src="panel.js"></script>
</body>
</html>
