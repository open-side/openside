[package]
name = "openside-agent-sidecar"
description = "openside agent runtime over a supervised JSONL sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openside-core = { path = "../openside-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "resource"] }
parking_lot = "0.12"
rand = "0.8"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
jsonschema = { version = "0.49", default-features = false }

[lints]
workspace = true
