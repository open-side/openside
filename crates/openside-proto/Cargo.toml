[package]
name = "openside-proto"
description = "Public API schema for openside: sessions, messages, events, tickets, settings (serde + JSON Schema + OpenAPI 3.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
openside-core = { path = "../openside-core" }
openside-policy = { path = "../openside-policy" }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
