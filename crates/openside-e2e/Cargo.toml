[package]
name = "openside-e2e"
description = "Cross-crate end-to-end tests for openside (daemon, CLI, Python sidecar); not published"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
opensided = { path = "../opensided" }
openside-proto = { path = "../openside-proto" }
openside-cli = { path = "../openside-cli" }
openside-sessions = { path = "../openside-sessions" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
# The login fixture sites (src/login_fixture.rs).
axum = "0.8"
ring = "0.17"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term"] }

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
openside-config = { path = "../openside-config" }
openside-vault = { path = "../openside-vault" }
openside-sync = { path = "../openside-sync" }
openside-browser = { path = "../openside-browser" }
openside-import = { path = "../openside-import", features = ["testing"] }
openside-channels = { path = "../openside-channels" }
ed25519-dalek = "2"
tokio-util = "0.7"
url = "2"
base64 = "0.22"
openside-policy = { path = "../openside-policy" }
openside-push = { path = "../openside-push" }
tokio-tungstenite = "0.26"
# Relay transport tests (tests/remote_relay.rs, tests/mcp_remote.rs).
openside-relay = { path = "../openside-relay" }

[[bin]]
name = "e2e-opensided"
path = "src/bin/opensided.rs"

[[bin]]
name = "e2e-openside"
path = "src/bin/openside.rs"

[lints]
workspace = true
