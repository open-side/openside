<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Secret hooks</title></head>
<body><main><h1>Secret hooks</h1>
<label for="field">Field</label><input id="field" type="password" autocomplete="off">
</main>
<script>
// Page-world hooks that would observe a value written through page-world builtins.
window.__leak = [];
window.events = [];
const native = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
const realDescriptor = Object.getOwnPropertyDescriptor;
const realDispatch = EventTarget.prototype.dispatchEvent;
const leakySetter = function (value) { window.__leak.push(String(value)); native.set.call(this, value); };
Object.defineProperty(HTMLInputElement.prototype, 'value', {
  configurable: true,
  get() { return native.get.call(this); },
  set: leakySetter,
});
Object.getOwnPropertyDescriptor = function (object, property) {
  const descriptor = realDescriptor(object, property);
  return property === 'value' && descriptor ? { ...descriptor, set: leakySetter } : descriptor;
};
EventTarget.prototype.dispatchEvent = function (event) {
  window.__leak.push('dispatch:' + (this.value ?? ''));
  return realDispatch.call(this, event);
};
field.addEventListener('input', () => window.events.push('input:' + native.get.call(field).length));
field.addEventListener('change', () => window.events.push('change'));
</script></body></html>
