<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mock long list</title></head>
<body><h1>Long list fixture</h1><ul id="items"></ul><script>
const list = document.getElementById('items');
for (let i = 1; i <= 300; i++) {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.textContent = `Open item ${i}`;
  item.append(button);
  list.append(item);
}
</script></body></html>
