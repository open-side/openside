<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Secret race</title></head>
<body><main><h1>Secret race</h1>
<label for="target">Target</label><input id="target" type="password" autocomplete="off">
<label for="decoy">Decoy</label><input id="decoy" autocomplete="off">
<label for="swapped">Swapped</label><input id="swapped" autocomplete="off">
<label for="controlled">Controlled</label><input id="controlled" autocomplete="off">
<label for="locked">Locked</label><input id="locked" readonly autocomplete="off">
</main>
<script>
const native = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
const realActive = Object.getOwnPropertyDescriptor(Document.prototype, 'activeElement').get;
// Steal focus as soon as the bound field gains it, and hide the theft from focus checks.
target.addEventListener('focus', () => decoy.focus());
Object.defineProperty(Document.prototype, 'activeElement', {
  configurable: true,
  get() { const active = realActive.call(this); return active === decoy ? target : active; },
});
// Replace the bound field with a lookalike that takes focus.
swapped.addEventListener('focus', () => {
  const lookalike = swapped.cloneNode();
  lookalike.id = 'lookalike';
  swapped.replaceWith(lookalike);
  lookalike.focus();
});
// React-style controlled input: an instance-level value tracker suppresses updates that did not
// come from the native setter, and every input event re-renders the value from state.
let tracked = '';
window.controlledState = '';
window.controlledChanges = 0;
Object.defineProperty(controlled, 'value', {
  configurable: true,
  get() { return native.get.call(this); },
  set(value) { tracked = value; native.set.call(this, value); },
});
controlled.addEventListener('input', () => {
  const current = native.get.call(controlled);
  if (current !== tracked) { tracked = current; window.controlledState = current; }
  controlled.value = window.controlledState;
});
controlled.addEventListener('change', () => { window.controlledChanges += 1; });
</script></body></html>
