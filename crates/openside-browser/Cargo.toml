[package]
name = "openside-browser"
description = "CDP browser controller with tab ledger and accessibility snapshots for openside"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
parking_lot = "0.12"
png = "0.17"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
url = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "process", "signal", "user"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
axum = "0.8"
openside-config = { path = "../openside-config" }
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
