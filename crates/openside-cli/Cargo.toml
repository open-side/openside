[package]
name = "openside-cli"
description = "openside command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openside"
path = "src/main.rs"

[dependencies]
# `openside mcp` returns screenshots as base64 image content.
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openside-config = { path = "../openside-config" }
openside-import = { path = "../openside-import" }
openside-proto = { path = "../openside-proto" }
openside-memory = { path = "../openside-memory" }
openside-policy = { path = "../openside-policy" }
openside-skills = { path = "../openside-skills" }
# `--remote` profiles reached through a relay or a direct HTTPS tunnel.
openside-relay = { path = "../openside-relay" }
# Doctor reads the vault file header and probes the OS keyring; it never unlocks.
openside-vault = { path = "../openside-vault" }
qrcode = { version = "0.14", default-features = false }
# Only `openside memory model fetch` downloads; the daemon and memory store stay offline.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
toml = "0.8"
# `openside remote setup` edits config.toml in place and keeps the user's comments.
toml_edit = "0.22"
url = "2"

# Remote profile tokens; Linux uses libsecret's `secret-tool` instead (see remotes.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
# `ticket resolve <id>` without a value turns terminal echo off for its hidden prompt.
nix = { version = "0.29", features = ["term"] }

[dev-dependencies]
axum = "0.8"
openside-import = { path = "../openside-import", features = ["testing"] }
futures-util = "0.3"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "client"] }
parking_lot = "0.12"

[lints]
workspace = true
