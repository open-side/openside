[package]
name = "openside-relay"
description = "Self-hostable Noise relay for openside: pairing-key-pinned E2E transport for CLI/MCP; relay-served PWA code requires operator trust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openside-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
curve25519-dalek = "4"
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
snow = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.26"
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
