[package]
name = "openside-repl"
description = "Sandboxed Playwright-compatible JavaScript REPL over the openside CDP controller"
version.workspace = true
edition.workspace = true
license.workspace = true
# rquickjs 0.14 (ADR-021) requires Rust 1.87; the rest of the workspace keeps its own floor.
rust-version = "1.87"

[dependencies]
futures-util = "0.3"
openside-browser = { path = "../openside-browser" }
regex = "1"
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
openside-config = { path = "../openside-config" }
parking_lot = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
