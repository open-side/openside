[package]
name = "opensided"
description = "openside daemon: public API v1 over unix socket and 127.0.0.1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
regex = "1"
toml = "0.8"
openside-push = { path = "../openside-push" }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
fs2 = "0.4"
schemars = "1"
zeroize = "1"
parking_lot = "0.12"
openside-config = { path = "../openside-config" }
openside-agent-sidecar = { path = "../openside-agent-sidecar" }
openside-vault = { path = "../openside-vault" }
openside-proto = { path = "../openside-proto" }
openside-sessions = { path = "../openside-sessions" }
openside-core = { path = "../openside-core" }
openside-policy = { path = "../openside-policy" }
openside-browser = { path = "../openside-browser" }
openside-sched = { path = "../openside-sched" }
openside-memory = { path = "../openside-memory" }
openside-skills = { path = "../openside-skills" }
openside-repl = { path = "../openside-repl" }
openside-sync = { path = "../openside-sync" }
tempfile = "3"
base64 = "0.22"
hmac = "0.12"
png = "0.17"
rqrr = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "user"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.26"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[lints]
workspace = true
