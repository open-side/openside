[package]
name = "opensided"
description = "openside daemon: public API v1 over unix socket and 127.0.0.1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
async-stream = "0.3"
tokio-tungstenite = "0.26"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
rand = "0.8"
regex = "1"
toml = "0.8"
openside-push = { path = "../openside-push" }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
psl = "2"
fs2 = "0.4"
schemars = "1"
zeroize = "1"
parking_lot = "0.12"
openside-config = { path = "../openside-config" }
openside-channels = { path = "../openside-channels" }
openside-agent-sidecar = { path = "../openside-agent-sidecar" }
openside-vault = { path = "../openside-vault" }
openside-proto = { path = "../openside-proto" }
openside-sessions = { path = "../openside-sessions" }
openside-core = { path = "../openside-core" }
openside-policy = { path = "../openside-policy" }
openside-browser = { path = "../openside-browser" }
openside-sched = { path = "../openside-sched" }
openside-memory = { path = "../openside-memory" }
openside-model-fetch = { path = "../openside-model-fetch" }
openside-skills = { path = "../openside-skills" }
openside-import = { path = "../openside-import" }
openside-repl = { path = "../openside-repl" }
openside-sync = { path = "../openside-sync" }
# Relay transport: outbound registration and end-to-end encrypted device streams (F-8).
openside-relay = { path = "../openside-relay" }
tempfile = "3"
base64 = "0.22"
hmac = "0.12"
png = "0.17"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rqrr = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "user", "resource"] }
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ed25519-dalek = "2"
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
jsonschema = { version = "0.49", default-features = false }

[lints]
workspace = true
