[package]
name = "openside-push"
description = "Web Push (RFC 8030) sender with RFC 8291 payload encryption and RFC 8292 VAPID, plus a loopback fake push service for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "fs"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
