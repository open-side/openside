[package]
name = "openside-config"
description = "Portable configuration, executable discovery, and diagnostics for openside"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
dirs = "6"
p256 = { version = "0.13", features = ["arithmetic"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
regex = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
