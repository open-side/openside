[graph]
all-features = true

[advisories]
version = 2
db-path = "target/advisory-db"
# zbus 5's helper crates are "unmaintained" notices, not vulnerabilities: zbus 6 folded
# them in but also removed the blocking API that the Secret Service clients in
# openside-vault (platform/secret_service.rs) and openside-import (safe_storage.rs) are
# built on. Drop these when those clients move to zbus 6, or if a vulnerability is filed
# against zbus 5.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5 unmaintained (merged into zbus 6); blocked on zbus 6 async migration" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 unmaintained (merged into zbus 6); blocked on zbus 6 async migration" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 unmaintained (merged into zbus 6); blocked on zbus 6 async migration" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "BSL-1.0", "Zlib",
  "Unicode-3.0", "Unlicense", "CDLA-Permissive-2.0",
]
# option-ext is an unmodified dirs dependency. MPL is file-level copyleft;
# its original source and license remain available from the crates.io package.
exceptions = [
  { name = "option-ext", allow = ["MPL-2.0"] },
  # The encoder's IJG-derived DCT retains its permissive copyright and warranty notice.
  { name = "jpeg-encoder", allow = ["IJG"] },
]

[bans]
multiple-versions = "warn"
# This repository uses in-tree path dependencies; release publishing is separate.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
