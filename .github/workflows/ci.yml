name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 8

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Sync credential-free sidecar
        run: uv sync --project agent --frozen
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked -j 8
      # The daemon's shell sandbox needs bwrap; without it the real-sidecar E2Es fail with
      # runtime error sandbox_unavailable. The hosted ubuntu image does not ship it.
      - name: Install sandbox and isolated headed QA runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap podman zbar-tools
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, which breaks
      # both bwrap and Chromium's sandbox (launches die with `Disconnected`).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # gate.sh runs cargo test before its own JS install steps, and the extension E2E shells out to
      # `pnpm -C extension build` (tsx); a fresh checkout has no node_modules yet.
      - name: Install web and extension dependencies
        run: pnpm -C web install --frozen-lockfile && pnpm -C extension install --frozen-lockfile
      - name: Full Linux gate
        env:
          OPENSIDE_GATE_JOBS: 8
        run: tools/gate.sh
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gate
          path: target/gate

  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # Runtime support is Linux-first; these runners expose compile regressions.
      - name: Compile the same workspace
        run: cargo check --workspace --all-targets --locked -j 8
